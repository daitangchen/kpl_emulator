<style>
/* KPL 战队经营模拟器 —— 单文件样式表
   深色电竞风，移动端优先，桌面端限制最大宽度居中 */
:root {
  --bg: #0b0e14;
  --bg-soft: #121722;
  --bg-card: #171d2b;
  --bg-hi: #1e2637;
  --line: #263048;
  --line-soft: #1c2333;
  --txt: #e8edf7;
  --txt-dim: #8e9ab4;
  --txt-mute: #5d6883;
  --gold: #f5c451;
  --gold-dim: #8a6d24;
  --blue: #4a9eff;
  --green: #35d07f;
  --red: #ff5f6d;
  --purple: #a97bff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
}

#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 780px;
  margin: 0 auto;
  background: linear-gradient(180deg, #0d1119 0%, #0b0e14 100%);
}

/* ── 顶栏 ───────────────────────────────────────────── */
#topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(13, 17, 25, .94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-soft);
  padding: 10px 14px 8px;
}
.tb-row { display: flex; align-items: center; gap: 10px; }
.tb-team { font-weight: 700; font-size: 16px; letter-spacing: .5px; }
.tb-div {
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
  background: var(--bg-hi); color: var(--gold); border: 1px solid var(--gold-dim);
}
.tb-stage { flex: 1; text-align: right; font-size: 12px; color: var(--txt-dim); }
.tb-stats { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--txt-dim); }
.tb-stats b { color: var(--txt); font-weight: 600; }
.tb-stats .danger b { color: var(--red); }
.tb-stats .good b { color: var(--green); }

/* ── 屏幕 ───────────────────────────────────────────── */
#screen { flex: 1; padding: 14px; padding-bottom: 84px; }
h1, h2, h3 { margin: 0 0 10px; font-weight: 700; }
h1 { font-size: 20px; }
h2 { font-size: 16px; color: var(--txt); }
h3 { font-size: 14px; color: var(--txt-dim); font-weight: 600; letter-spacing: .3px; }
p { margin: 0 0 10px; }
.dim { color: var(--txt-dim); }
.mute { color: var(--txt-mute); font-size: 12px; }
.gold { color: var(--gold); }
.green { color: var(--green); }
.red { color: var(--red); }
.blue { color: var(--blue); }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }

/* ── 卡片 ───────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
}
.card.hi { border-color: var(--line); background: var(--bg-hi); }
.card.gold { border-color: var(--gold-dim); }
.card.danger { border-color: #5c2530; background: #1d1319; }
.card-title { font-weight: 700; margin-bottom: 8px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.card-title .tag { margin-left: auto; }

/* ── 按钮 ───────────────────────────────────────────── */
button {
  font-family: inherit;
  font-size: 14px;
  color: var(--txt);
  background: var(--bg-hi);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  cursor: pointer;
  transition: transform .06s, background .15s;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary {
  background: linear-gradient(180deg, #3d7ee0, #2f66bb);
  border-color: #4a86e8; font-weight: 700;
}
button.gold { background: linear-gradient(180deg, #d8a93c, #b8862a); border-color: #e8c060; color: #1a1405; font-weight: 700; }
button.ghost { background: transparent; }
button.small { padding: 5px 10px; font-size: 12px; }
button.block { width: 100%; display: block; }

.btn-row { display: flex; gap: 8px; }
.btn-row > button { flex: 1; }

/* ── 底部动作区 ─────────────────────────────────────── */
#tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  max-width: 780px;
  margin: 0 auto;
  display: flex;
  background: rgba(13, 17, 25, .96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line-soft);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  z-index: 30;
}
#tabbar button {
  flex: 1; background: none; border: none; padding: 8px 4px;
  font-size: 11px; color: var(--txt-mute); display: flex;
  flex-direction: column; align-items: center; gap: 3px;
}
#tabbar button.on { color: var(--gold); }
#tabbar button .ico { font-size: 17px; line-height: 1; }

/* ── 表格 / 榜单 ────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--line-soft); }
th { color: var(--txt-mute); font-weight: 600; font-size: 11px; letter-spacing: .4px; }
td.num, th.num { text-align: center; width: 34px; }
tr.me td { background: rgba(245, 196, 81, .10); color: var(--gold); font-weight: 700; }
tr.elim td { opacity: .38; }
tr.advance td { border-left: 2px solid var(--green); }
tr.relegate td { border-left: 2px solid var(--red); }

.div-head {
  display: flex; align-items: center; gap: 8px; margin: 14px 0 6px;
  font-weight: 700; font-size: 14px;
}
.div-head .badge {
  width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
  font-size: 12px; font-weight: 800;
}
.badge.S { background: linear-gradient(180deg, #f5c451, #c9992c); color: #1a1405; }
.badge.A { background: linear-gradient(180deg, #7fb2ff, #4a7fd0); color: #06121f; }
.badge.B { background: linear-gradient(180deg, #6b7590, #4a5368); color: #0d1017; }

/* ── 比分卡 ─────────────────────────────────────────── */
.score-line {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--line-soft);
  font-size: 14px;
}
.score-line:last-child { border-bottom: none; }
.score-line .t { flex: 1; }
.score-line .t.right { text-align: right; }
.score-line .sc {
  font-weight: 800; font-variant-numeric: tabular-nums; min-width: 46px;
  text-align: center; letter-spacing: .5px;
}
.score-line.win .sc { color: var(--green); }
.score-line.lose .sc { color: var(--red); }
.score-line.mine { background: rgba(74, 158, 255, .09); border-radius: 6px; padding: 7px 6px; }
.score-line .flag { font-size: 10px; color: var(--txt-mute); }
.score-line .flag.m { color: var(--gold); }
.score-line .flag.e { color: var(--txt-dim); }

/* 对局小圆点 */
.games { display: flex; gap: 4px; margin-top: 6px; }
.game-dot {
  width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; background: var(--bg-soft); color: var(--txt-mute);
}
.game-dot.w { background: rgba(53, 208, 127, .22); color: var(--green); }
.game-dot.l { background: rgba(255, 95, 109, .18); color: var(--red); }
.game-dot.peak { outline: 1px solid var(--gold); }

/* 巅峰对决横幅 */
.peak-banner {
  margin-top: 8px; padding: 8px 10px; border-radius: var(--radius-sm);
  background: linear-gradient(90deg, rgba(245, 196, 81, .18), rgba(169, 123, 255, .18));
  border: 1px solid var(--gold-dim); font-size: 12px; color: var(--gold); font-weight: 600;
}

/* ── 巅峰对决 BP ───────────────────────────────────── */
.peak-meta { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
.peak-meta-hero {
  background: var(--bg-hi); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 6px 4px; text-align: center; min-width: 0;
}
.peak-meta-hero .mute { font-size: 10px; }
.peak-meta-hero .nm { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.peak-meta-hero .tag { font-size: 10px; margin-top: 2px; display: inline-block; }
.peak-pick-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-top: 1px solid var(--line-soft); font-size: 12px;
}
.peak-pick-row .pos { flex: none; width: 72px; color: var(--txt-dim); }
.peak-pick-row .grow { display: flex; align-items: baseline; gap: 4px; overflow: hidden; }
.peak-pick-row .mute { font-size: 11px; }
.peak-lineup { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.peak-lineup .mute { flex: none; width: 44px; }
.peak-lineup .pill { font-size: 11px; padding: 2px 6px; }
/* 对手 BP 习惯 */
.peak-habit { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
.peak-habit-hero {
  background: rgba(255, 95, 109, .08); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 5px 4px; text-align: center; min-width: 0;
}
.peak-habit-hero .mute { font-size: 10px; }
.peak-habit-hero .nm { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; max-height: 60vh; overflow-y: auto; }
.hero-opt {
  display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: var(--radius-sm);
  background: var(--bg-hi); border: 1px solid var(--line); cursor: pointer; font-size: 13px;
}
.hero-opt:hover { border-color: var(--gold-dim); }
.hero-opt.on { border-color: var(--gold); background: rgba(245, 196, 81, .1); }
.hero-opt b { flex: 1; }
.hero-opt .tag { font-size: 10px; }
.hero-opt .mute { font-size: 11px; }

/* ── 阶段进度 ───────────────────────────────────────── */
.stage-strip { display: flex; gap: 4px; margin-bottom: 12px; }
.stage-strip .seg {
  flex: 1; height: 4px; border-radius: 2px; background: var(--bg-hi);
}
.stage-strip .seg.done { background: var(--gold-dim); }
.stage-strip .seg.now { background: var(--gold); }

/* ── 选手卡 ─────────────────────────────────────────── */
.p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.p-card {
  background: var(--bg-card); border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm); padding: 9px;
}
.p-card.starter { border-color: var(--line); }
.p-card .nm { font-weight: 700; font-size: 14px; }
.p-card .role { font-size: 11px; color: var(--txt-mute); }
.p-card .ovr { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.p-card .bar { height: 3px; background: var(--bg-hi); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.p-card .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4a9eff, #35d07f); }

/* ── 弹窗 ───────────────────────────────────────────── */
#modal-root:empty { display: none; }
.modal-bg {
  position: fixed; inset: 0; background: rgba(4, 6, 10, .78);
  display: grid; place-items: center; padding: 18px; z-index: 100;
  animation: fade .16s ease;
}
.modal {
  width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
  background: var(--bg-card); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; box-shadow: var(--shadow);
  animation: pop .18s ease;
}
.modal h2 { margin-bottom: 10px; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } }

/* ── 提示条 ─────────────────────────────────────────── */
#toast-root { position: fixed; bottom: 78px; left: 0; right: 0; z-index: 120; pointer-events: none; }
.toast {
  max-width: 420px; margin: 6px auto; padding: 9px 14px; border-radius: 20px;
  background: rgba(30, 38, 55, .96); border: 1px solid var(--line);
  font-size: 13px; text-align: center; box-shadow: var(--shadow);
  animation: fade .2s ease;
}

/* ── 选队页 ─────────────────────────────────────────── */
.team-pick {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
}
.team-opt {
  text-align: left; padding: 10px; border-radius: var(--radius-sm);
  background: var(--bg-card); border: 1px solid var(--line-soft);
}
.team-opt.on { border-color: var(--gold); background: rgba(245, 196, 81, .09); }
.team-opt .nm { font-weight: 700; font-size: 14px; }
.team-opt .mt-line { font-size: 11px; color: var(--txt-mute); margin-top: 3px; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 11px; }

/* ── 年度积分 / 荣誉 ────────────────────────────────── */
.pill {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; background: var(--bg-hi); color: var(--txt-dim);
  border: 1px solid var(--line-soft); margin: 0 4px 4px 0;
}
.pill.gold { color: var(--gold); border-color: var(--gold-dim); }
.pill.blue { color: var(--blue); border-color: #26456e; }
.pill.green { color: var(--green); border-color: #1f5c3d; }

.honor-wall { display: flex; flex-wrap: wrap; gap: 6px; }

/* ── 大字数字 ───────────────────────────────────────── */
.big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat-box { text-align: center; flex: 1; }
.stat-box .k { font-size: 11px; color: var(--txt-mute); }
.stat-box .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

.split { display: flex; gap: 8px; }
.split > * { flex: 1; }

.ledger { font-size: 13px; }
.ledger .li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line-soft); }
.ledger .li:last-child { border-bottom: none; }
.ledger .li.total { font-weight: 700; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 7px; }

/* ── 训练中心 / 资金决策 ─────────────────────────────── */
.btn-col { display: flex; flex-direction: column; gap: 6px; }
.btn-col > button { width: 100%; }
.train-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; border-top: 1px solid var(--line-soft);
}
.train-row:first-of-type { border-top: none; }

/* ── 抽卡建队 ───────────────────────────────────────── */
.draft-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--line-soft);
}
.draft-row:last-child { border-bottom: none; }
.draft-role { width: 52px; flex: none; font-size: 12px; color: var(--txt-dim); }
.draft-card { flex: 1; min-width: 0; }
.draft-ovr { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }

/* 稀有度徽章 */
.rarity {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--bg-hi); white-space: nowrap;
}
.rarity.tone-gold { color: #1a1405; background: linear-gradient(180deg, #f5c451, #c9992c); border-color: #e8c060; }
.rarity.tone-purple { color: #f2ecff; background: linear-gradient(180deg, #7d4fd0, #5b35a3); border-color: #a97bff; }
.rarity.tone-blue { color: #06121f; background: linear-gradient(180deg, #7fb2ff, #4a7fd0); border-color: #4a86e8; }
.rarity.tone-plain { color: var(--txt-mute); }

/* ── 球员剧情线：性格 / 成长弧 / 采访 ─────────────────── */
.p-card.clickable { cursor: pointer; }
.p-card.clickable:active { transform: scale(.99); }
.p-card.clickable:hover { border-color: var(--line); }

/* 性格 / 成长弧标签：按 tone 上色 */
.pill.tone-gold { color: var(--gold); border-color: var(--gold-dim); }
.pill.tone-red { color: var(--red); border-color: #5c2530; }
.pill.tone-green { color: var(--green); border-color: #1f5c3d; }
.pill.tone-blue { color: var(--blue); border-color: #26456e; }
.pill.tone-purple { color: var(--purple); border-color: #40305e; }
.pill.trait { background: rgba(255, 255, 255, .03); }

/* 迷你成长曲线 */
.grow-bars {
  display: flex; align-items: flex-end; gap: 8px;
  height: 96px; margin-top: 10px; padding: 6px 2px 0;
  border-bottom: 1px solid var(--line-soft);
}
.grow-bars .gb {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; height: 100%;
}
.grow-bars .gb .bar {
  width: 60%; min-height: 6px; border-radius: 4px 4px 0 0;
  background: linear-gradient(180deg, #4a9eff, #35d07f);
}
.grow-bars .gb.down .bar { background: linear-gradient(180deg, #ff8a5c, #ff5f6d); }
.grow-bars .gb .lb { font-size: 10px; color: var(--txt-mute); margin-top: 4px; }
.grow-bars .gb .val { font-size: 10px; color: var(--txt-dim); font-variant-numeric: tabular-nums; }

/* 赛后采访 */
.interview {
  margin-top: 8px; padding: 8px 10px; border-radius: var(--radius-sm);
  background: var(--bg-soft); border-left: 3px solid var(--line);
}
.interview.win { border-left-color: var(--green); }
.interview.lose { border-left-color: var(--red); }
.interview .who { font-size: 12px; font-weight: 700; }
.interview .said { font-size: 13px; color: var(--txt-dim); margin-top: 3px; }

/* 更衣室 / 焦点故事行 */
.locker-row {
  padding: 8px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer;
}
.locker-row:last-child { border-bottom: none; }
.locker-row:hover { background: rgba(255, 255, 255, .02); }

/* 语录 */
.quote {
  font-size: 13px; color: var(--txt-dim); font-style: italic;
  border-left: 2px solid var(--gold-dim); padding: 2px 0 2px 10px; margin: 8px 0 0;
}


/* ══════════════════ 工作台：2×2 网格（三角落常驻 + 中央页签切换） ══════════════════ */
.workbench {
  display: grid;
  grid-template-areas:
    "workspace match"
    "board     next";
  /* 左上工作台给足宽度（约 7 成），右栏只放信息 */
  grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, auto);
  gap: 10px;
  height: 100%;
  min-height: 0;
}
/* 工作台主区域：内容压缩到一屏；万一超长则内部滚动兜底（不裁剪） */
.panel-workspace { grid-area: workspace; min-height: 0; overflow-y: auto; }
.panel-match      { grid-area: match; }
.panel-board      { grid-area: board; }
.panel-next       { grid-area: next; }

.panel-workspace, .panel-board, .panel-match, .panel-squad, .panel-next {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 11px;
  min-width: 0;
}
.panel-board, .panel-match, .panel-squad, .panel-next { overflow-y: auto; }
.panel-title {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  font-size: 13px; font-weight: 700; margin-bottom: 6px;
}

/* 右下：下一步/推进按钮面板 */
.panel-next { display: flex; flex-direction: column; justify-content: center; }
.panel-next .primary { width: 100%; font-size: 14px; padding: 12px; }

/* 左下：历史战绩（荣誉 + 名次 + 交战记录） */
.history { display: flex; flex-direction: column; gap: 8px; }
.his-sec { display: flex; flex-direction: column; gap: 2px; }
.his-title { font-size: 11px; color: var(--txt-dim); font-weight: 700; margin-bottom: 2px; }
.his-honor { font-size: 12px; color: var(--gold); }
.his-rank { font-size: 12px; color: var(--txt); }
.his-h2h { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 1px 0; border-top: 1px solid var(--line-soft); }
.his-h2h .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.his-h2h .rec { font-variant-numeric: tabular-nums; }
.his-h2h .rec.win { color: var(--green); }
.his-h2h .rec.lose { color: var(--red); }
.his-h2h .last { font-size: 11px; color: var(--txt-mute); }

/* 左下：常规赛积分榜（保留，供窄屏/页签使用） */
.board-table { display: flex; flex-direction: column; gap: 9px; }
.board-row {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 2px 0; border-top: 1px solid var(--line-soft);
}
.board-row .pos { width: 14px; color: var(--txt-mute); font-variant-numeric: tabular-nums; }
.board-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-row .rec { color: var(--txt-dim); font-variant-numeric: tabular-nums; }
.board-row .net { width: 26px; text-align: right; color: var(--txt-mute); font-variant-numeric: tabular-nums; }
.board-row.mine { color: var(--gold); font-weight: 700; }
.board-row.mine .rec, .board-row.mine .net { color: var(--gold); }

/* 左下：淘汰赛对阵图（官方赛程图样式：横向分层树） */
.bk2 { overflow-x: auto; overflow-y: hidden; }
.bk2-grid { display: flex; gap: 10px; align-items: stretch; min-width: 300px; }
.bk2-stack { display: flex; flex-direction: column; gap: 8px; justify-content: space-around; flex: 1 1 0; }
.bk2-col { display: flex; flex-direction: column; gap: 4px; flex: 1 1 0; }
.bk2-col-title {
  font-size: 10px; color: var(--txt-dim); font-weight: 700;
  border-left: 3px solid var(--gold-dim); padding-left: 4px; margin-bottom: 2px;
}
.bk2-col.wb .bk2-col-title { border-left-color: var(--gold); }
.bk2-col.f .bk2-col-title { border-left-color: var(--gold); color: var(--gold); }
.bk2-node {
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg-hi); overflow: hidden;
  position: relative; flex: none;
}
.bk2-node::after {
  /* 晋级连接线：从节点右侧伸出一段横线 */
  content: ''; position: absolute; right: -8px; top: 50%;
  width: 8px; height: 2px; background: var(--line);
}
.bk2-col:last-child .bk2-node::after { display: none; }
.bk2-node.mine { border-color: var(--gold); }
.bk2-row {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 2px 5px; line-height: 1.35;
}
.bk2-row + .bk2-row { border-top: 1px solid var(--line-soft); }
.bk2-team { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bk2-team.win { color: var(--green); font-weight: 700; }
.bk2-team.lose { color: var(--txt-mute); text-decoration: line-through; }
.bk2-score { width: 12px; flex: none; text-align: center; color: var(--txt-dim); font-variant-numeric: tabular-nums; }
/* 保留旧的 .brk-* 以兼容（如有残留） */
.brk-sec { margin-bottom: 8px; }
.brk-title { font-size: 11px; color: var(--txt-dim); margin-bottom: 3px; }

/* 右下：战队情况 */
.mini-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-bottom: 6px; }
.mini-stats .ms { background: var(--bg-hi); border-radius: var(--radius-sm); padding: 4px 6px; text-align: center; min-width: 0; }
.mini-stats .ms .k { display: block; font-size: 10px; color: var(--txt-mute); }
.mini-stats .ms b { font-size: 12px; }
.squad-list { display: flex; flex-direction: column; }
.squad-row {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 4px 0; border-top: 1px solid var(--line-soft); cursor: pointer;
}
.squad-row:first-child { border-top: none; }
.squad-row .role { width: 40px; flex: none; color: var(--txt-dim); font-size: 11px; }
.squad-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.squad-row .ovr { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
.panel-match .games { margin-top: 4px; }

/* ══════════════════ 整屏不滚动：外壳改为占满视口的弹性布局 ══════════════════
   目标：主界面永远是一屏，不出现整页上下滚动条；需要时由各个面板内部滚动。
   建队页 / 休赛期表单内容较长，会移除 #screen 的 locked 类，恢复内部滚动。 */
html, body { height: 100%; overflow: hidden; }

#app {
  height: 100vh;
  height: 100dvh;
  max-width: 1500px;
  overflow: hidden;
}
#topbar {
  position: static;
  flex: 0 0 auto;
  padding: 8px 14px 7px;
}
#topbar:empty { display: none; }
#screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 12px;
}
#screen.locked {
  overflow: hidden;
  /* 锁定模式下让 .workbench 能可靠地撑满整屏（flex 列 + 子项 stretch） */
  display: flex;
  flex-direction: column;
}
#tabbar {
  position: static;
  flex: 0 0 auto;
  max-width: none;
  margin: 0;
  padding-top: 4px;
  padding-bottom: max(4px, env(safe-area-inset-bottom));
}
#tabbar:empty { display: none; }

/* 工作台：撑满 #screen 的可用高度 */
.workbench {
  flex: 1 1 auto;
  min-height: 0;
  align-items: stretch;
  /* 兜底：即便父级不是 flex 容器，也尽量占满 */
  height: 100%;
}

/* 细滚动条（只在面板内部出现） */
.panel-workspace, .panel-board, .panel-match, .panel-squad, .panel-next, #screen {
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.panel-workspace::-webkit-scrollbar, .panel-board::-webkit-scrollbar,
.panel-match::-webkit-scrollbar, .panel-squad::-webkit-scrollbar,
.panel-next::-webkit-scrollbar, #screen::-webkit-scrollbar { width: 6px; height: 6px; }
.panel-workspace::-webkit-scrollbar-thumb, .panel-board::-webkit-scrollbar-thumb,
.panel-match::-webkit-scrollbar-thumb, .panel-squad::-webkit-scrollbar-thumb,
.panel-next::-webkit-scrollbar-thumb, #screen::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.panel-workspace::-webkit-scrollbar-track, .panel-board::-webkit-scrollbar-track,
.panel-match::-webkit-scrollbar-track, .panel-squad::-webkit-scrollbar-track,
.panel-next::-webkit-scrollbar-track, #screen::-webkit-scrollbar-track { background: transparent; }

/* 左下积分榜：S/A/B 三组并排，撑满整行，不留空白 */
.board-split {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}
.board-table {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
.board-head {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; margin-bottom: 3px;
}
.board-head .mute { font-size: 10px; margin-left: auto; }
.board-row { font-size: 12px; padding: 1px 0; }
.board-row .nm { min-width: 0; }
.board-row .rec { font-size: 11px; }

/* 工作台里的卡片收紧一点，尽量一屏放下 */
.panel-workspace .card { padding: 8px 10px; margin-bottom: 0; }
.panel-workspace .card-title { font-size: 13px; margin-bottom: 3px; }
.panel-workspace h1 { font-size: 16px; margin-bottom: 5px; }
.panel-workspace h2 { font-size: 14px; margin: 4px 0 6px; }
.panel-workspace p { margin-bottom: 6px; }
.panel-workspace .card + .card { margin-top: 6px; }

/* 训练页：一行一名球员，保证工作台一屏放下 */
.tr-rows { display: flex; flex-direction: column; gap: 4px; }
.tr-row {
  display: grid;
  grid-template-columns: minmax(70px, 1.2fr) repeat(5, minmax(0, 1fr));
  gap: 4px; align-items: center;
  background: var(--bg-hi); border-radius: var(--radius-sm);
  padding: 4px 6px;
}
.tr-row.tr-head { background: none; padding: 0 6px; }
.tr-row.tr-head span { font-size: 10px; color: var(--txt-mute); font-weight: 700; text-align: center; }
.tr-row.tr-head .tr-p { text-align: left; }
.tr-p { display: flex; align-items: baseline; gap: 2px; overflow: hidden; cursor: pointer; min-width: 0; }
.tr-p b { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-p .gold { font-size: 12px; }
.tr-btn { width: 100%; padding: 5px 2px; font-size: 11px; text-align: center; }

/* 近五场战绩里的胜负小点 */
.his-h2h .dot { flex: none; width: 20px; text-align: center; font-size: 10px; border-radius: 4px; }
.his-h2h .dot.w { background: rgba(53, 208, 127, .15); color: var(--green); }
.his-h2h .dot.l { background: rgba(255, 95, 109, .15); color: var(--red); }

/* 窄屏（不分栏时由 JS 直接渲染整页，这里只做兜底）：放开滚动 */
@media (max-width: 1099px) {
  #screen.locked { overflow-y: auto; }
  .workbench { height: auto; }
  .panel-workspace, .panel-board, .panel-match, .panel-squad, .panel-next {
    overflow-y: visible; min-height: 0;
  }
  .board-table { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* ══════════════════ 视觉增强（v1.9 整体美化） ══════════════════ */

/* 背景氛围：顶部金色光晕 + 底部蓝紫光晕，营造电竞舞台感 */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 420px at 50% -8%, rgba(245, 196, 81, .10), transparent 60%),
    radial-gradient(720px 420px at 85% 110%, rgba(74, 158, 255, .10), transparent 60%),
    radial-gradient(620px 380px at 12% 108%, rgba(169, 123, 255, .08), transparent 60%);
}
#app {
  max-width: 1500px;
  background: transparent;
}

/* 卡片：更精致的边框与内发光 */
.card {
  border: 1px solid var(--line-soft);
  background: linear-gradient(180deg, rgba(30, 38, 55, .72), rgba(23, 29, 43, .9));
  box-shadow: 0 1px 0 rgba(255, 255, 255, .02) inset, 0 8px 20px rgba(0, 0, 0, .18);
}
.card.hi { border-color: var(--line); background: linear-gradient(180deg, rgba(38, 48, 70, .75), rgba(30, 38, 55, .9)); }
.card.gold {
  border-color: var(--gold-dim);
  background: linear-gradient(180deg, rgba(245, 196, 81, .08), rgba(23, 29, 43, .92));
  box-shadow: 0 0 0 1px rgba(245, 196, 81, .12) inset, 0 10px 26px rgba(0, 0, 0, .28);
}

/* 卡片标题：左侧金色竖条，强化层级 */
.card-title { position: relative; padding-left: 10px; }
.card-title::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 14px; border-radius: 2px;
  background: linear-gradient(180deg, var(--gold), var(--gold-dim));
}

/* 面板标题：金色装饰 */
.panel-title { position: relative; padding-left: 10px; }
.panel-title::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 14px; border-radius: 2px;
  background: linear-gradient(180deg, var(--gold), var(--gold-dim));
}

/* 标题 h1：金色渐变文字 */
h1 {
  background: linear-gradient(90deg, #f8d57e, #f5c451 40%, #e8a33c);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}

/* 按钮：更精致的渐变与阴影，hover 发光 */
button {
  background: linear-gradient(180deg, #232c41, #1b2233);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
}
button:hover:not(:disabled) { border-color: #35455f; }
button.primary {
  background: linear-gradient(180deg, #4a8bee, #3167bf);
  border-color: #5d97f2;
  box-shadow: 0 3px 12px rgba(74, 158, 255, .28);
}
button.primary:hover:not(:disabled) { box-shadow: 0 4px 16px rgba(74, 158, 255, .42); }
button.gold {
  background: linear-gradient(180deg, #e2b24a, #bd8b28);
  border-color: #f0c96a; color: #1a1405;
  box-shadow: 0 3px 12px rgba(245, 196, 81, .3);
}
button.gold:hover:not(:disabled) { box-shadow: 0 4px 18px rgba(245, 196, 81, .45); }

/* 顶栏：金色渐变底线 + 音乐按钮 */
#topbar { border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, transparent, var(--gold-dim), transparent) 1; }
.tb-bgm {
  flex: none; width: 30px; height: 30px; padding: 0;
  border-radius: 50%; display: grid; place-items: center; font-size: 14px;
}

/* 比分卡数字：更醒目 */

/* 小圆点：圆润 + 微光 */
.game-dot { border-radius: 50%; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.game-dot.w { box-shadow: 0 0 8px rgba(53, 208, 127, .35); }
.game-dot.l { box-shadow: 0 0 8px rgba(255, 95, 109, .3); }

/* 滚动条：金色系 */
.panel-workspace::-webkit-scrollbar-thumb, .panel-board::-webkit-scrollbar-thumb,
.panel-match::-webkit-scrollbar-thumb, .panel-squad::-webkit-scrollbar-thumb,
.panel-next::-webkit-scrollbar-thumb, #screen::-webkit-scrollbar-thumb,
.modal::-webkit-scrollbar-thumb, .hero-picker::-webkit-scrollbar-thumb {

}

.peak-banner { box-shadow: 0 4px 16px rgba(245, 196, 81, .15); }

.hero-opt { transition: border-color .12s, transform .06s, background .12s; }
.hero-opt:hover { border-color: var(--gold); background: rgba(245, 196, 81, .06); }
.hero-opt:active { transform: scale(.98); }
.hero-opt.on { box-shadow: 0 0 0 1px var(--gold) inset; }

/* 工作台面板：微妙的背景层次 */
.panel-workspace, .panel-board, .panel-match, .panel-next, .panel-squad {
  background: linear-gradient(180deg, rgba(23, 29, 43, .8), rgba(18, 23, 34, .88));
}

/* 弹窗：精致描边 */

.toast { border-color: var(--gold-dim); background: linear-gradient(180deg, rgba(38, 48, 70, .97), rgba(30, 38, 55, .97)); }

/* ══════════════════ 巅峰对决金边渐显 + 夺冠捧杯 ══════════════════ */

/* 巅峰对决卡片：金边从无到有渐渐镶嵌 */
.peak-card { position: relative; overflow: hidden; }
.peak-card::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  border: 2px solid transparent;
  animation: peak-gold-in 1.6s ease forwards;
}
@keyframes peak-gold-in {
  0%   { border-color: rgba(245, 196, 81, 0); box-shadow: inset 0 0 0 rgba(245, 196, 81, 0); }
  45%  { border-color: rgba(245, 196, 81, .28); }
  100% { border-color: rgba(245, 196, 81, .9); box-shadow: inset 0 0 26px rgba(245, 196, 81, .16); }
}
/* 金边持续呼吸光晕 */
.peak-card::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  animation: peak-gold-breathe 3s ease-in-out infinite;
}
@keyframes peak-gold-breathe {
  0%, 100% { box-shadow: inset 0 0 0 rgba(245, 196, 81, 0); }
  50%      { box-shadow: inset 0 0 34px rgba(245, 196, 81, .22); }
}

/* 夺冠捧杯卡片 */
.champion-card {
  position: relative; overflow: hidden;
  margin-top: 10px; padding: 22px 14px; text-align: center;
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(245, 196, 81, .12), rgba(23, 29, 43, .94));
  border: 1px solid var(--gold-dim);
  animation: champion-in .8s ease;
}
@keyframes champion-in { from { opacity: 0; transform: translateY(14px); } }
.champion-trophy {
  font-size: 56px; line-height: 1;
  animation: trophy-rise .9s cubic-bezier(.2, .7, .3, 1.2) both;
}
@keyframes trophy-rise { from { opacity: 0; transform: translateY(22px) scale(.7); } to { opacity: 1; transform: translateY(0) scale(1); } }
.champion-title {
  margin-top: 8px; font-size: 22px; font-weight: 800;
  background: linear-gradient(90deg, #ffe08a, #f5c451 45%, #e8a33c);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.champion-sub { margin-top: 4px; font-size: 13px; color: var(--gold); font-weight: 600; }
.champion-rays {
  position: absolute; left: 50%; top: 30px; width: 200px; height: 200px;
  transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(circle, rgba(245, 196, 81, .28), transparent 65%);
  animation: champion-rays 2.4s ease-in-out infinite;
}
@keyframes champion-rays {
  0%, 100% { opacity: .5; transform: translateX(-50%) scale(.9); }
  50%      { opacity: 1; transform: translateX(-50%) scale(1.15); }
}
.champion-card .interview { text-align: left; background: rgba(0, 0, 0, .16); }

/** 每轮开打前打乱组内顺序，避免对手顺序固定 */
function rotateGroups(game, groups, salt = 0) {
  const out = {};
  for (const d of DIVISIONS) {
    const ids = groups[d].slice();
    if (ids.length !== 6) { out[d] = ids; continue; }
    const shift = (game.season * 2 + salt) % 6;
    out[d] = ids.slice(shift).concat(ids.slice(0, shift));
  }
  return out;
}

/** 生成一个赛季的赛程骨架 */
function stageListForSeason(season) {
  const stages = [];
  const reg = (ev, roundIndex, note) => ([1, 2, 3].forEach(() => {}), {
    kind: 'group',
    eventId: ev,
    eventName: ev === 'spring' ? 'KPL 春季赛' : 'KPL 夏季赛',
    roundIndex,
    roundName: REGULAR_ROUNDS[roundIndex - 1].name,
    note,
    days: 5,
    cursor: 0,
    done: false,
    results: [],
  });
  stages.push(reg('spring', 1, '抽签分组，组内单循环'));
  stages.push({ kind: 'regroup', eventId: 'spring', eventName: 'KPL 春季赛', label: '第一轮结束 · S/A/B 重组', done: false });
  stages.push(reg('spring', 2, '组内单循环，胜者争取冲组'));
  stages.push({ kind: 'card', eventId: 'spring', eventName: 'KPL 春季赛', label: 'S/A · A/B 卡位赛', done: false, results: [] });
  stages.push(reg('spring', 3, 'S 组争季后赛席位，B 组后四名提前结束'));
  stages.push({ kind: 'bracket', eventId: 'spring', eventName: 'KPL 春季赛', label: '季后赛', day: 1, done: false, bracket: null });

  stages.push({ kind: 'bracket', eventId: 'challenger', eventName: '挑战者杯', label: '挑杯 8 强双败', day: 1, done: false, bracket: null, finalBestOf: 9 });

  stages.push(reg('summer', 1, '重新抽签分组'));
  stages.push({ kind: 'regroup', eventId: 'summer', eventName: 'KPL 夏季赛', label: '第一轮结束 · S/A/B 重组', done: false });
  stages.push(reg('summer', 2, '组内单循环'));
  stages.push({ kind: 'card', eventId: 'summer', eventName: 'KPL 夏季赛', label: 'S/A · A/B 卡位赛', done: false, results: [] });
  stages.push(reg('summer', 3, 'S 组争季后赛席位'));
  stages.push({ kind: 'bracket', eventId: 'summer', eventName: 'KPL 夏季赛', label: '季后赛', day: 1, done: false, bracket: null });

  stages.push({ kind: 'finals', eventId: 'finals', eventName: 'KPL 年度总决赛', label: '年度总决赛', phase: 'arena', day: 1, done: false, bracket: null });
  return stages;
}

/** 开季 */
function startSeason(game) {
  // 转会窗 / 抽卡可能拿走首发：开季前必须补齐五个位置，否则赛季会以残阵开打。
  // 注意：建档时 game.__rng 还不存在（要等第一次推进才创建），这里必须给一个兜底随机源，
  // 否则新建档会跳过补位——历史上就是这样让"被抽走球员的原队"以 4 人残阵开季的。
  const rng = game.__rng || createRng(game.seed || 20261005);
  for (const teamId of Object.keys(game.teams)) {
    repairSquad(game, rng, teamId);
  }
  game.stageIndex = 0;
  game.stages = stageListForSeason(game.season);
  game.groupsByRound = {};
  game.tablesByRound = {};
  game.divisionOf = {};
  game.seasonMatches = { spring: [], summer: [] };
  // 疲劳不随开季清零：休赛期接的商务要带着状态代价进入新赛季，否则"放假狂接商务"就是白拿钱。
  // 它只靠每个比赛日自然恢复（见 business.recoverFatigue）。
  if (!game.fatigue) game.fatigue = {};
  for (const id of Object.keys(game.teams)) {
    if (typeof game.fatigue[id] !== 'number') game.fatigue[id] = 0;
  }
  // 新赛季重置特训次数（赛季上限按赛季计）
  game.training = {};
  game.trainingTeam = { morale: 0, chem: 0 };
  game.flags.trainingSpend = 0;
  // 商务运营次数与疲劳也按赛季重置
  game.business = {};
  game.flags.businessIncome = 0;
  game.flags.matchIncome = 0;
  if (game.season === 1) {
    game.groupsByRound[1] = initialGroupsForSeason(game);
    game.startDivision = 'B';
  } else {
    game.groupsByRound[1] = snakeOrder(
      Object.keys(game.teams).sort((a, b) => teamPower(game, b) - teamPower(game, a)),
    );
    // 保留上季末分组：直接使用上季结果
    if (game.lastDivisionGroups) game.groupsByRound[1] = game.lastDivisionGroups;
    game.startDivision = DIVISIONS.find((d) => (game.groupsByRound[1][d] || []).includes(game.userTeamId)) || 'B';
  }
  return game;
}

function currentStage(game) {
  const st = game.stages[game.stageIndex] || null;
  if (!st) return null;
  // 年总是"一个阶段多个子阶段"：擂台赛→突围赛→淘汰赛，全部走完才算真正结束
  if (st.kind === 'finals') {
    return st.done && st.phase === 'playoff' && st.bracket?.find((m) => m.id === 'F')?.winnerId ? null : st;
  }
  return st.done ? null : st;
}

/** 年度总决赛小组赛/突围赛阶段的「大师组 × 精英组」实时积分榜（左下角用） */
function finalsBoard(game) {
  const st = currentStage(game);
  if (!st || st.kind !== 'finals') return null;
  if (st.phase === 'playoff') return null;   // 淘汰赛阶段交给对阵图
  const masters = st.masters || [];
  const elite = st.elite || [];
  if (!masters.length && !elite.length) return null;
  const res = st.results || [];
  return {
    phase: st.phase,
    masters,
    elite,
    mastersTable: buildStandings(masters, res.filter((m) => masters.includes(m.a) || masters.includes(m.b))),
    eliteTable: buildStandings(elite, res.filter((m) => elite.includes(m.a) || elite.includes(m.b))),
  };
}

function ensureGroupDay(game, stage) {
  if (!stage._days) {
    // 直接用该轮的正式分组，保证界面显示与模拟口径一致
    const groups = game.groupsByRound[stage.roundIndex];
    stage._groups = groups;
    stage._days = regularMatchdays(groups);
  }
  return stage._days;
}

/** 汇总某轮所有比赛结果，生成三张积分榜 */
function tablesForRound(game, stage) {
  const groups = stage._groups || game.groupsByRound[stage.roundIndex];
  const matches = stage.results || [];
  const tables = {};
  for (const d of DIVISIONS) {
    tables[d] = buildStandings(groups[d] || [], matches.filter((m) => m.division === d));
  }
  return tables;
}

/**
 * 全联盟排名
 *  strict=true（默认）：先按 S/A/B 组别，再按组内名次 —— 用于展示与组别升降
 *  strict=false：只看战绩（胜场→净胜局）—— 用于赛季末的董事会考核与年度积分
 */
function overallRanking(game, { strict = true } = {}) {
  const lastRound = Math.max(...Object.keys(game.tablesByRound).map(Number).filter((n) => !Number.isNaN(n)), 0);
  const tables = game.tablesByRound[lastRound] || {};
  const groups = game.groupsByRound[lastRound] || game.groupsByRound[3] || game.groupsByRound[1] || { S: [], A: [], B: [] };
  const scored = [];
  for (const d of DIVISIONS) {
    const t = tables[d];
    const ranked = t ? rankTeams(groups[d] || [], t) : (groups[d] || []);
    ranked.forEach((id, i) => {
      scored.push({ id, div: d, divRank: i + 1, wins: t?.[id]?.wins ?? 0, net: t?.[id]?.netGames ?? 0 });
    });
  }
  if (strict) {
    scored.sort((a, b) => {
      const da = DIVISIONS.indexOf(a.div);
      const db = DIVISIONS.indexOf(b.div);
      if (da !== db) return da - db;
      return a.divRank - b.divRank;
    });
  } else {
    scored.sort((a, b) => (b.wins - a.wins) || (b.net - a.net));
  }
  return scored.map((r, i) => ({ ...r, rank: i + 1 }));
}

function divisionGroupsFromRanking(game) {
  const groups = { S: [], A: [], B: [] };
  const lastRound = Math.max(...Object.keys(game.groupsByRound).map(Number), 1);
  const src = game.groupsByRound[lastRound] || game.groupsByRound[1];
  for (const d of DIVISIONS) groups[d] = (src[d] || []).slice();
  return groups;
}

/** 卡位赛对阵（S/A 与 A/B） */
function cardPairs(groups) {
  return {
    upper: { high: groups.S, low: groups.A },
    lower: { high: groups.A, low: groups.B },
  };
}

/**
 * 卡位赛对阵列表：高组第 5/6 名 vs 低组第 2/1 名（BO7）
 * 注意传入的必须是"按战绩排好序"的组内数组。
 */
function cardPairList(ranked) {
  const pairUp = (hi, lo) => [[hi[4], lo[1]], [hi[5], lo[0]]];
  return [...pairUp(ranked.S || [], ranked.A || []), ...pairUp(ranked.A || [], ranked.B || [])];
}

/** 打完玩家自己的卡位赛（BO7 两段式 + 巅峰对决阵容博弈）并结算第三轮分组 */
function resumeCardSeries(game, rng, action, stage, groups) {
  const pend = game.__pendingSeries;
  const s = pend.series;

  if (pend.phase === 'lineup') {
    const lineup = playLineupPhase(game, s, action, rng);
    const seg = playSeriesSegment(s, rng, seriesPower(game, s, lineup.boostA, lineup.boostB));
    return finalizeCardSeries(game, stage, groups, s, [seg], { lineup, adjustment: pend.adjustment || null });
  }

  const adjust = applySeriesAdjustment(game, action, s);
  const power = seriesPower(game, s, adjust.isA ? adjust.boost : 0, adjust.isA ? 0 : adjust.boost);
  const { chunks, deciderPending } = advanceSeriesToStop(s, rng, power);
  if (deciderPending) {
    game.__pendingSeries = { ...pend, phase: 'lineup', adjustment: adjust };
    return {
      type: 'seriesPause',
      phase: 'lineup',
      card: true,
      stage,
      day: 0,
      match: pend.match,
      series: s,
      chunks,
      adjustment: adjust,
    };
  }
  return finalizeCardSeries(game, stage, groups, s, chunks, { adjustment: adjust });
}

/** 卡位赛收尾：写回结果并重算第三轮分组 */
function finalizeCardSeries(game, stage, groups, s, chunks, extra = {}) {
  const result = finishSeries(s);
  const playerCard = { a: s.p.teamA.id, b: s.p.teamB.id, ...result, isPlayer: true };
  const pend = game.__pendingSeries || {};
  const cards = [...(pend.otherCards || []), playerCard];

  const next = divisionsAfterCards(game, groups, cards);
  game.groupsByRound[3] = next;
  game.tablesByRound[3] = Object.fromEntries(DIVISIONS.map((d) => [d, buildStandings(next[d] || [], [])]));
  game.divisionOf = next;
  stage.results = cards;
  stage.done = true;
  game.__pendingSeries = null;

  return {
    type: 'card',
    cards,
    groups: next,
    ranked: stage.ranked,
    playerCard,
    chunks,
    adjustment: extra.adjustment || null,
    lineup: extra.lineup || null,
  };
}

function divisionsAfterCards(game, groups, cardResults) {
  const next = { S: groups.S.slice(), A: groups.A.slice(), B: groups.B.slice() };
  for (const m of cardResults) {
    const isUpper = next.S.includes(m.a);
    const highDiv = isUpper ? 'S' : 'A';
    const lowDiv = isUpper ? 'A' : 'B';
    if (m.winnerId === m.b) {
      next[highDiv] = next[highDiv].filter((x) => x !== m.a).concat(m.b);
      next[lowDiv] = next[lowDiv].filter((x) => x !== m.b).concat(m.a);
    }
  }
  return next;
}

/** 挑战者杯：跳过 32 进 8，直接按上季/本季实力取 8 队（含 2 支次级联赛黑马） */
function buildChallengerSeeds(game) {
  const ranked = Object.keys(game.teams).sort((a, b) => teamPower(game, b) - teamPower(game, a));
  const seeds = ranked.slice(0, 6);
  const wildcards = [ranked[10], ranked[14]].filter(Boolean);
  const pool = [...seeds, ...wildcards, ranked[6], ranked[7]];
  return pool.slice(0, 8);
}

/** 年度积分 → 年总 12 队与分组 */
function annualStandings(game) {
  const pts = game.annualPoints || {};
  const rows = Object.keys(game.teams).map((id) => ({ id, points: pts[id] || 0 }));
  rows.sort((a, b) => b.points - a.points || teamPower(game, b.id) - teamPower(game, a.id));
  return rows.map((r, i) => ({ ...r, rank: i + 1, group: i < FINALS_RULES.masters ? 'masters' : 'elite' }));
}

/** 擂台赛：大师组 × 精英组 组外单循环，6 个比赛日 */
function buildArenaSchedule(masters, elite) {
  const days = [];
  for (let d = 0; d < 6; d += 1) {
    const fixtures = [];
    for (let i = 0; i < 6; i += 1) {
      const m = masters[i];
      const e = elite[(i + d) % 6];
      if (m && e) fixtures.push({ a: m, b: e });
    }
    days.push({ round: d + 1, fixtures });
  }
  return days;
}

/** ────────────────────────── 推进主函数 ────────────────────────── */
function advance(game, rng, action = {}) {
  const stage = currentStage(game);
  if (!stage) return endOfSeason(game);
  const pid = game.userTeamId;

  if (stage.kind === 'group') {
    const days = ensureGroupDay(game, stage);
    let day = days[stage.cursor];
    // B 组后四名提前结束赛季：从第三轮起，被淘汰的队伍不再出战
    const excluded = stage.eliminated || [];
    const trimFixtures = (d) => {
      if (!excluded.length) return d;
      const fixtures = d.fixtures.filter((f) => !excluded.includes(f.a) && !excluded.includes(f.b));
      return { ...d, fixtures };
    };
    day = trimFixtures(day);
    const playerEliminated = excluded.includes(pid);
    if (playerEliminated && !stage.earlyExitNoted) {
      stage.earlyExitNoted = true;
      stage.cursor = days.length;
      stage.done = true;
      return {
        type: 'eliminatedEarly',
        stage,
        message: 'B 组后四名确定，你的战队本赛季提前结束。剩余赛程空转，没有比赛、没有奖金、没有曝光。',
        eliminated: excluded,
      };
    }
    const results = day.fixtures.length
      ? playMatchday(game, rng, day, pid, {
        bestOf: 5,
        homeTeamId: pid,
        roundName: `${stage.eventName} ${stage.roundName}`,
        stage: '常规赛',
      })
      : [];
    stage.results.push(...results);
    stage.cursor += 1;
    const tables = tablesForRound(game, stage);
    const groups = stage._groups;
    game.tablesByRound[stage.roundIndex] = tables;
    game.groupsByRound[stage.roundIndex] = groups;
    for (const d of DIVISIONS) game.divisionOf[d] = groups[d];
    const finished = stage.cursor >= days.length;
    if (finished) {
      stage.done = true;
      // B 组后四名提前结束赛季（第三轮）
      if (stage.roundIndex === 3) {
        const rankedB = rankTeams(groups.B, tables.B);
        stage.eliminated = rankedB.slice(4);
      }
    }
    return {
      type: 'matchday',
      stage,
      day: day.round,
      totalDays: days.length,
      results,
      playerResult: results.find((r) => r.isPlayer) || null,
      tables,
      groups,
      finished,
      eliminated: stage.eliminated || [],
      standings: finished ? overallRanking(game) : null,
    };
  }

  if (stage.kind === 'regroup') {
    const r1 = game.stages.find((s) => s.kind === 'group' && s.eventId === stage.eventId && s.roundIndex === 1);
    const groups = r1._groups || game.groupsByRound[1];
    // 必须用第一轮的正式积分榜（tablesByRound[1]）。
    // 历史 bug：这里曾读 r1._tables（被初始化为 {S:null,A:null,B:null} 的真值对象），
    // 于是 rankTeams 拿到空表、全部并列，重组退化成"按初始分组顺序"，完全无视战绩。
    const tables = game.tablesByRound[1] || tablesForRound(game, r1);
    r1._tables = tables;
    const next = regroupByRank(groups, tables);
    game.groupsByRound[2] = next;
    // 第二轮的分组积分榜从零开始
    game.tablesByRound[2] = Object.fromEntries(DIVISIONS.map((d) => [d, buildStandings(next[d] || [], [])]));
    game.divisionOf = next;
    stage.done = true;
    const flat = Object.fromEntries(DIVISIONS.map((d) => [d, next[d].slice()]));
    return { type: 'regroup', groups: flat, tables, ranking: overallRanking(game) };
  }

  if (stage.kind === 'card') {
    const groups = game.groupsByRound[2] || divisionGroupsFromRanking(game);
    const tables = game.tablesByRound[2] || {};
    /**
     * 卡位赛必须按「第二轮的战绩名次」配对，而不是分组数组的下标。
     * 历史 bug：groupsByRound[2] 是重组时按 [S5-6, A5-6, B5-6] 拼出来的数组，
     * 下标 4/5 与"组内第 5/6 名"毫无关系，于是高组第 5/6、低组第 1/2 全部取错人，
     * 出现过"小组第 4 被拉去打卡位赛，赢了反而掉组"的荒唐结果。
     */
    const ranked = {
      S: rankTeams(groups.S || [], tables.S),
      A: rankTeams(groups.A || [], tables.A),
      B: rankTeams(groups.B || [], tables.B),
    };
    stage.ranked = ranked;
    const pairs = cardPairList(ranked);

    // 玩家自己的卡位赛同样是 BO7 生死局 → 走两段式（先上半场，再调整）
    if (game.__pendingSeries && game.__pendingSeries.kind === 'card') {
      return resumeCardSeries(game, rng, action, stage, groups);
    }

    const cards = [];
    let paused = null;
    for (const [a, b] of pairs) {
      if (!a || !b) continue;
      const common = {
        teamA: { id: a, name: game.teams[a].name, power: teamPower(game, a), mentality: teamMentality(game, a) },
        teamB: { id: b, name: game.teams[b].name, power: teamPower(game, b), mentality: teamMentality(game, b) },
        bestOf: 7,
        homeTeamId: a,
        stage: '卡位赛',
      };
      if (a === pid || b === pid) {
        const series = startSeries(common);
        const first = playSeriesSegment(series, rng);
        paused = { match: { id: `card_${a}_${b}`, a, b }, series, first };
        continue;
      }
      const r = simulateQuick(common, rng);
      cards.push({ a, b, ...r, isPlayer: false });
    }
    if (paused) {
      game.__pendingSeries = { kind: 'card', phase: 'half', match: paused.match, series: paused.series, otherCards: cards, groups };
      return {
        type: 'seriesPause',
        card: true,
        stage,
        day: 0,
        match: paused.match,
        series: paused.series,
        first: paused.first,
      };
    }

    const next = divisionsAfterCards(game, groups, cards);
    game.groupsByRound[3] = next;
    game.tablesByRound[3] = Object.fromEntries(DIVISIONS.map((d) => [d, buildStandings(next[d] || [], [])]));
    game.divisionOf = next;
    stage.results = cards;
    stage.done = true;
    return { type: 'card', cards, groups: next, ranked, playerCard: cards.find((c) => c.isPlayer) || null };
  }

  if (stage.kind === 'bracket') {
    if (!stage.bracket) {
      const seeds = stage.eventId === 'challenger'
        ? buildChallengerSeeds(game)
        : playoffSeeds(game);
      stage.bracket = doubleElimTemplate8(seeds);
      stage.seeds = seeds;
    }
    const opts = { finalBestOf: stage.eventId === 'challenger' ? 9 : 7, bestOf: 7 };

    // 玩家自己的 BO7/BO9 分两段推进：上半场打完先挂起，等界面给出调整窗口
    if (game.__pendingSeries) {
      return resumePlayerSeries(game, rng, action, stage, opts);
    }

    const res = playBracketDay(game, rng, stage.bracket, stage.day, pid, { ...opts, pausePlayerSeries: true });
    if (res.paused) {
      game.__pendingSeries = { kind: 'bracket', phase: 'half', matchId: res.paused.match.id, series: res.paused.series, opts };
      return {
        type: 'seriesPause',
        stage,
        day: res.day,
        match: res.paused.match,
        series: res.paused.series,
        first: res.paused.first,
        otherMatches: res.matches,
      };
    }
    stage.day += 1;
    if (res.finished) {
      stage.done = true;
      const pm = placementMap(stage.bracket);
      stage.placementMap = pm;
      for (const [tid, pl] of Object.entries(pm)) {
        game.placements[tid] = game.placements[tid] || {};
        game.placements[tid][stage.eventId] = pl;
      }
      stage.championId = res.championId;
      stage.playerPlacement = pm[pid] ?? null;
    }
    return {
      type: 'bracket',
      stage,
      bracket: stage.bracket,
      day: res.day,
      matches: res.matches,
      playerMatch: res.playerMatch,
      finished: res.finished,
      championId: res.championId,
      playerPlacement: stage.playerPlacement ?? null,
    };
  }

  if (stage.kind === 'finals') {
    return advanceFinals(game, rng, stage);
  }

  return { type: 'unknown' };
}

/** ────────────────────── 玩家系列赛的两段式推进 ────────────────────── */

/**
 * 中场调整：换人 / 临场布置（花钱换本场战力）/ 不做调整
 * @returns {{type:string, boost:number, text:string, isA:boolean}}
 */
function applySeriesAdjustment(game, action, series) {
  const pid = game.userTeamId;
  const isA = series.p.teamA.id === pid;
  const out = { type: 'none', boost: 0, text: '不做调整，直接进入下半场。', isA };
  const req = action && action.series;
  if (!req) return out;

  if (req.type === 'swap' && req.inId && req.outId) {
    const r = setStarter(game, req.inId, req.outId);
    if (r.ok) {
      out.type = 'swap';
      out.text = `换人：${game.players[req.inId].name} 替下 ${game.players[req.outId].name}`;
    } else {
      out.text = `换人未生效：${r.reason}`;
    }
  } else if (req.type === 'boost') {
    const { boostCost, boostGain } = SERIES_ADJUST;
    if (game.cash >= boostCost) {
      game.cash -= boostCost;
      game.flags.trainingSpend = (game.flags.trainingSpend || 0) + boostCost;
      out.type = 'boost';
      out.boost = boostGain;
      out.cost = boostCost;
      out.text = `临场布置：花费 ${boostCost} 万，本场剩余局战力 +${boostGain}`;
    } else {
      out.text = `现金不足，临场布置未生效（需要 ${boostCost} 万）。`;
    }
  }
  return out;
}

/** 打完玩家自己那场的剩余部分，并把结果写回签表 */
/** 双方当前战力（含中场调整与阵容博弈的修正） */
function seriesPower(game, s, boostA = 0, boostB = 0) {
  return {
    powerA: teamPower(game, s.p.teamA.id) + boostA,
    powerB: teamPower(game, s.p.teamB.id) + boostB,
    mentalityDiff: teamMentality(game, s.p.teamA.id) - teamMentality(game, s.p.teamB.id),
  };
}

/** 巅峰对决前的阵容博弈：玩家逐位置选 5 个英雄，AI 按自己的风格出招 */
function playLineupPhase(game, s, action, rng) {
  const myId = s.p.teamA.id === game.userTeamId ? s.p.teamA.id : s.p.teamB.id;
  const oppId = myId === s.p.teamA.id ? s.p.teamB.id : s.p.teamA.id;
  const mine = (action && action.picks) ? action.picks : null;   // 缺省由 resolvePeak 用版本强势补齐
  const theirs = aiPeakPicks(game, oppId, rng);
  const r = resolvePeak(game, myId, oppId, mine, theirs);
  const boost = myId === s.p.teamA.id ? [r.bonus, 0] : [0, r.bonus];
  return { ...r, boostA: boost[0], boostB: boost[1] };
}

/**
 * 把系列赛推进到下一个停顿点
 *  - 分出胜负 → done
 *  - 下一段正好是第 2N-1 局（巅峰对决）→ 停下来做阵容博弈
 */
function advanceSeriesToStop(s, rng, power) {
  const chunks = [];
  let guard = 0;
  while (guard++ < 8) {
    const segIndexBefore = s.segIndex;
    const seg = playSeriesSegment(s, rng, power);
    chunks.push(seg);
    if (seg.done) return { chunks, done: true, deciderPending: false };
    if (s.segments[s.segIndex] === s.targetWins * 2 - 1) return { chunks, done: false, deciderPending: true };
    if (s.segIndex === segIndexBefore) break;
  }
  return { chunks, done: s.a === s.targetWins || s.b === s.targetWins, deciderPending: false };
}

/** 系列赛收尾：写回签表、推进比赛日、结算名次 */
function finalizeBracketSeries(game, stage, m, result, chunks, extra = {}) {
  applyMatchResult(stage.bracket, m, result);
  game.__pendingSeries = null;
  stage.day += 1;

  const final = stage.bracket.find((x) => x.id === 'F');
  const finished = stage.bracket.every((x) => x.winnerId) || !!final?.winnerId;
  if (finished) {
    stage.done = true;
    const pm = placementMap(stage.bracket);
    stage.placementMap = pm;
    for (const [tid, pl] of Object.entries(pm)) {
      game.placements[tid] = game.placements[tid] || {};
      game.placements[tid][stage.eventId] = pl;
    }
    stage.championId = final?.winnerId || null;
    stage.playerPlacement = pm[game.userTeamId] ?? null;
  }

  return {
    type: 'bracket',
    stage,
    bracket: stage.bracket,
    chunks,
    adjustment: extra.adjustment || null,
    lineup: extra.lineup || null,
    day: stage.day - 1,
    matches: [{ match: m, result }],
    playerMatch: { match: m, result },
    finished,
    championId: final?.winnerId || null,
    playerPlacement: stage.playerPlacement ?? null,
  };
}

function resumePlayerSeries(game, rng, action, stage, opts) {
  const pend = game.__pendingSeries;
  const s = pend.series;
  const m = stage.bracket.find((x) => x.id === pend.matchId);
  if (!m) { game.__pendingSeries = null; return { type: 'unknown' }; }

  // 阶段二：巅峰对决前的阵容博弈 —— 结算完就直接打最后一局
  if (pend.phase === 'lineup') {
    const lineup = playLineupPhase(game, s, action, rng);
    const seg = playSeriesSegment(s, rng, seriesPower(game, s, lineup.boostA, lineup.boostB));
    const result = { ...finishSeries(s), matchId: m.id, label: m.label, bestOf: s.bestOf };
    return finalizeBracketSeries(game, stage, m, result, [seg], { lineup, adjustment: pend.adjustment || null });
  }

  // 阶段一：中场调整 → 打下半场（若打到 3-3 则停在巅峰对决前）
  const adjust = applySeriesAdjustment(game, action, s);
  const power = seriesPower(game, s, adjust.isA ? adjust.boost : 0, adjust.isA ? 0 : adjust.boost);
  const { chunks, done, deciderPending } = advanceSeriesToStop(s, rng, power);

  if (deciderPending) {
    game.__pendingSeries = { ...pend, phase: 'lineup', adjustment: adjust };
    return {
      type: 'seriesPause',
      phase: 'lineup',
      stage,
      day: stage.day,
      match: m,
      series: s,
      chunks,
      adjustment: adjust,
    };
  }

  const result = { ...finishSeries(s), matchId: m.id, label: m.label, bestOf: s.bestOf };
  return finalizeBracketSeries(game, stage, m, result, chunks, { adjustment: adjust });
}

/** 季后赛种子：S 组前 4（胜者组）+ A 组前 2、S 组 5-6（败者组） */
function playoffSeeds(game) {
  const groups = game.groupsByRound[3] || game.groupsByRound[2];
  const tables = game.tablesByRound[3] || game.tablesByRound[2];
  const S = rankTeams(groups.S, tables.S);
  const A = rankTeams(groups.A, tables.A);
  return [S[0], S[1], S[2], S[3], S[4], S[5], A[0], A[1]].filter(Boolean);
}

/** 名次 → 奖金 + 年度积分 + 声望 */
function awardPlacement(game, eventId, placement) {
  const ev = CALENDAR.find((e) => e.id === eventId);
  if (!ev) return { prize: 0, points: 0 };
  const table = ev.prize;
  let prize = 0;
  if (placement === 1) prize = table.champion;
  else if (placement === 2) prize = table.runnerUp;
  else if (placement <= 4) prize = table.semi;
  else if (placement <= 8) prize = table.quarter;
  else prize = Math.round(table.quarter * 0.4);

  const pointsTable = ANNUAL_POINTS[eventId] || {};
  const keys = Object.keys(pointsTable).map(Number).sort((a, b) => a - b);
  let points = 0;
  for (const k of keys) if (placement <= k) { points = pointsTable[k]; break; }

  const isPlayer = false; // 由调用方决定是否给玩家
  game.lastAward = { eventId, placement, prize, points };
  return { prize, points };
}

/** 年总：擂台赛 → 突围赛 → 淘汰赛 */
function advanceFinals(game, rng, stage) {
  const pid = game.userTeamId;
  if (stage.phase === 'arena') {
    if (!stage.arena) {
      const rows = annualStandings(game);
      stage.qualified = rows.slice(0, FINALS_RULES.qualified);
      stage.masters = stage.qualified.filter((r) => r.group === 'masters').map((r) => r.id);
      stage.elite = stage.qualified.filter((r) => r.group === 'elite').map((r) => r.id);
      if (!stage.qualified.some((r) => r.id === pid)) {
        // 玩家没进年总：直接自动推演全部
        stage.arenaDays = buildArenaSchedule(stage.masters, stage.elite);
        stage.autoAll = true;
      } else {
        stage.arenaDays = buildArenaSchedule(stage.masters, stage.elite);
      }
      stage.results = [];
    }
    const day = stage.arenaDays[stage.day - 1];
    if (day) {
      const results = playMatchday(game, rng, day, pid, { bestOf: 5, homeTeamId: pid, stage: '擂台赛' });
      stage.results.push(...results);
      stage.day += 1;
      if (stage.day > stage.arenaDays.length) {
        stage.arenaTables = {
          masters: buildStandings(stage.masters, stage.results.filter((m) => stage.masters.includes(m.a) || stage.masters.includes(m.b))),
          elite: buildStandings(stage.elite, stage.results.filter((m) => stage.elite.includes(m.a) || stage.elite.includes(m.b))),
        };
        stage.phase = 'survival';
        // 擂台赛结束：切到突围赛。年总整体仍未结束，done 必须保持 false，
        // 否则 currentStage 会把整季判定为结束，突围赛与淘汰赛都会被跳过。
        stage.done = false;
        nextStage(game);
      }
      // 实时积分榜（大师组 × 精英组，组外单循环）
      const tables = {
        masters: buildStandings(stage.masters, stage.results.filter((m) => stage.masters.includes(m.a) || stage.masters.includes(m.b))),
        elite: buildStandings(stage.elite, stage.results.filter((m) => stage.elite.includes(m.a) || stage.elite.includes(m.b))),
      };
      return {
        type: 'arena', stage, day: day.round, results,
        playerResult: results.find((r) => r.isPlayer) || null,
        finished: stage.day > stage.arenaDays.length,
        masters: stage.masters, elite: stage.elite, tables,
      };
    }
    stage.phase = 'survival';
    stage.done = false;
    nextStage(game);
    return { type: 'arena', stage, day: 0, results: [], finished: true };
  }

  if (stage.phase === 'survival') {
    if (!stage.survival) {
      const t = stage.arenaTables;
      const mRanked = rankTeams(stage.masters, t.masters);
      const eRanked = rankTeams(stage.elite, t.elite);
      stage.directToPlayoff = [...mRanked.slice(0, FINALS_RULES.advanceToPlayoff.mastersTop), eRanked[0]];
      const pool = [...mRanked.slice(4), ...eRanked.slice(1, 5)];
      stage.survival = {
        pool,
        pairs: [[pool[0], pool[5]], [pool[1], pool[4]], [pool[2], pool[3]]].filter((p) => p[0] && p[1]),
        winners: [],
      };
    }
    const results = [];
    for (const [a, b] of stage.survival.pairs) {
      if (stage.survival.winners.includes(a) || stage.survival.winners.includes(b)) continue;
      const common = {
        teamA: { id: a, name: game.teams[a].name, power: teamPower(game, a) },
        teamB: { id: b, name: game.teams[b].name, power: teamPower(game, b), mentality: 60 },
        bestOf: 7,
        homeTeamId: a,
        stage: '突围赛',
      };
      const involves = a === pid || b === pid;
      const r = involves ? simulateSeries(common, rng) : simulateQuick(common, rng);
      stage.survival.winners.push(r.winnerId);
      results.push({ a, b, ...r, isPlayer: involves });
    }
    stage.phase = 'playoff';
    stage.done = false;
    stage.day = 1;   // 淘汰赛是新的比赛日序列，擂台赛的 day 计数不能带过来
    nextStage(game);
    return { type: 'survival', stage, results, playerResult: results.find((r) => r.isPlayer) || null, finished: true };
  }

  if (stage.phase === 'playoff') {
    if (!stage.bracket) {
      const field = [...stage.directToPlayoff, ...stage.survival.winners];
      const ranked = field
        .map((id) => ({ id, p: teamPower(game, id) }))
        .sort((x, y) => y.p - x.p)
        .map((x) => x.id);
      stage.bracket = doubleElimTemplate8(ranked);
      stage.day = 1;
    }
    const res = playBracketDay(game, rng, stage.bracket, stage.day, pid, { bestOf: 7, finalBestOf: 7 });
    stage.day += 1;
    if (res.finished) {
      stage.done = true;
      const pm = placementMap(stage.bracket);
      stage.placementMap = pm;
      for (const [tid, pl] of Object.entries(pm)) {
        game.placements[tid] = game.placements[tid] || {};
        game.placements[tid].finals = pl;
      }
      stage.championId = res.championId;
      stage.playerPlacement = pm[pid] ?? null;
      nextStage(game);
    }
    return {
      type: 'bracket', stage, bracket: stage.bracket, day: res.day,
      matches: res.matches, playerMatch: res.playerMatch,
      finished: res.finished, championId: res.championId,
      playerPlacement: stage.playerPlacement ?? null,
    };
  }
  return { type: 'finalsDone', stage };
}

/** 找下一个未完成的阶段（到达最后一个阶段后停住，由 currentStage 判定整季是否结束） */
function nextStage(game) {
  while (game.stageIndex < game.stages.length && game.stages[game.stageIndex].done) {
    if (game.stageIndex >= game.stages.length - 1) break;
    game.stageIndex += 1;
  }
  return currentStage(game);
}

/**
 * 某支队伍当前所处组别
 * 优先第三轮分组，其次第二轮；轮次编号与 game.groupsByRound 的键一致
 */
function divisionOfTeam(game, teamId) {
  const keys = Object.keys(game.groupsByRound).map(Number).sort((a, b) => b - a);
  for (const k of keys) {
    const groups = game.groupsByRound[k];
    for (const d of DIVISIONS) {
      if ((groups[d] || []).includes(teamId)) return d;
    }
  }
  return game.startDivision || 'B';
}

/** 某个组别当前的 6 支队伍 */
function groupMembers(game, division) {
  const keys = Object.keys(game.groupsByRound).map(Number).sort((a, b) => b - a);
  for (const k of keys) {
    const ids = game.groupsByRound[k]?.[division];
    if (ids && ids.length) return ids;
  }
  return [];
}

/**
 * 赛季最终名次表（1-18），用于年度积分与奖金
 *  1-8：季后赛名次（冠军→1，亚军→2，四强→3/4，六强→5/6，八强→7/8）
 *  9-18：未进季后赛的队伍，按常规赛最后一轮所属组别与组内名次
 */
function finalLeaguePlacements(game) {
  const out = {};
  // 赛季最后一次季后赛（夏季赛）决定联赛最终排名
  const bracketStage = ['summer', 'spring']
    .map((ev) => game.stages.find((s) => s.kind === 'bracket' && s.eventId === ev && s.bracket))
    .find(Boolean);
  if (bracketStage) {
    const bracket = bracketStage.bracket;
    const final = bracket.find((m) => m.id === 'F');
    if (final?.winnerId) {
      out[final.winnerId] = 1;
      out[final.loserId] = 2;
    }
    // 按淘汰轮次深度定名次（L6 败者组决赛负者 = 3，W7 胜者组决赛负者 = 3）
    const depth = { W7: 3, L6: 3, W5: 4, W6: 4, L5: 4, L4: 5, L3: 5, L2: 6, W3: 6, W4: 6, L1: 7, W1: 7, W2: 7 };
    for (const m of bracket) {
      if (!m.loserId || out[m.loserId]) continue;
      if (m.bracket === 'F') continue;
      out[m.loserId] = depth[m.id] ?? 8;
    }
    for (const seed of bracketStage.seeds || []) if (!out[seed]) out[seed] = 5;
  }
  // 其余队伍按最后一轮的分组与组内名次排 9-18
  const lastRound = Math.max(...Object.keys(game.groupsByRound).map(Number).filter((n) => !Number.isNaN(n)), 0);
  const groups = game.groupsByRound[lastRound] || game.groupsByRound[1];
  const tables = game.tablesByRound[lastRound] || {};
  let next = 9;
  for (const d of DIVISIONS) {
    const ids = (groups?.[d] || []).filter((id) => !out[id]);
    const ranked = rankTeams(ids, tables[d]);
    for (const id of ranked) {
      if (out[id]) continue;
      out[id] = next;
      next += 1;
    }
  }
  for (const id of Object.keys(game.teams)) if (!out[id]) { out[id] = next; next += 1; }
  return out;
}

/** ────────────────────────── 赛季结算 ────────────────────────── */
function endOfSeason(game) {
  const pid = game.userTeamId;
  const leaguePlacement = finalLeaguePlacements(game);
  const rankMode = game.rankMode || 'record';
  const ranking = overallRanking(game, { strict: rankMode === 'division' });
  const me = ranking.find((r) => r.id === pid) || { rank: 18, div: 'B', divRank: 6 };

  /**
   * 终结名次口径
   *  - 打进季后赛的 8 队：一律以「季后赛战斗名次」为准（冠军就是第 1）。
   *    历史 bug：这里曾经对所有球队都用"跨组胜场"排序，导致拿了冠军的强队
   *    因为身处 S 组、常规赛胜场不占优，反而被排到第 15 名。
   *  - 未进季后赛的 9-18 名：按 rankMode 区分
   *      record  ：只看战绩（胜场 → 净胜局），B 组打得好也能排进中游
   *      division：严格按 S/A/B 组别与组内名次
   */
  const playoffRank = leaguePlacement[pid];
  let finalRank;
  if (playoffRank && playoffRank <= 8) {
    finalRank = playoffRank;
  } else if (rankMode === 'division') {
    finalRank = playoffRank || me.rank;
  } else {
    const outsides = ranking.filter((r) => (leaguePlacement[r.id] || 18) > 8);
    const idx = outsides.findIndex((r) => r.id === pid);
    finalRank = idx >= 0 ? 9 + idx : (playoffRank || me.rank);
  }

  // ── 奖金与年度积分 ──
  let prizeTotal = 0;
  const awards = [];
  for (const evId of ['spring', 'challenger', 'summer', 'finals']) {
    const st = game.stages.find((s) => s.eventId === evId && s.kind === 'bracket')
      || game.stages.find((s) => s.eventId === evId);
    const placement = st?.playerPlacement ?? null;
    const a = awardPlacement(game, evId, placement || 18);
    const champion = st?.championId === pid;
    const bonusPts = champion ? 8 : 0;
    game.annualPoints[pid] = (game.annualPoints[pid] || 0) + a.points + bonusPts;
    prizeTotal += a.prize;
    awards.push({ eventId: evId, placement: placement ?? null, prize: a.prize, points: a.points + bonusPts });
  }

  // 其他战队的年度积分：按各队在这三站的实际名次累加（与玩家同口径）
  const pointsFor = (evId, place) => {
    const tbl = ANNUAL_POINTS[evId];
    if (!tbl || !place) return 0;
    const keys = Object.keys(tbl).map(Number).sort((a, b) => a - b);
    for (const k of keys) if (place <= k) return tbl[k];
    return 0;
  };
  for (const id of Object.keys(game.teams)) {
    if (id === pid) continue;
    const pl = game.placements[id] || {};
    let pts = 0;
    for (const evId of ['spring', 'challenger', 'summer']) {
      pts += pointsFor(evId, pl[evId] || leaguePlacement[id] || 18);
    }
    game.annualPoints[id] = (game.annualPoints[id] || 0) + pts;
  }

  // ── 收支 ──
  const income = {
    leagueShare: leagueShareForRank(finalRank),
    sponsor: Math.round(FINANCE.sponsorBase + game.fame * FINANCE.sponsorPerFame),
    prize: prizeTotal,
    ticket: Math.round(FINANCE.ticketBase * (1 + game.fame / 100) * (me.div === 'S' ? 1.6 : me.div === 'A' ? 1.2 : 0.9)),
    merch: Math.round(FINANCE.merchBase * (1 + game.fame / 60)),
    transferIn: game.flags?.pendingTransferIncome || 0,
  };
  const wageBill = (game.squads[pid].starters || [])
    .concat(game.squads[pid].bench || [])
    .concat(game.squads[pid].youth || [])
    .reduce((s, id) => s + (game.players[id]?.wage || 0), 0);
  const expense = {
    wages: wageBill,
    base: FINANCE.baseCost,
    transfer: game.flags?.pendingTransferCost || 0,
    youth: game.flags?.youthInvest || 0,
  };
  const net = Object.values(income).reduce((a, b) => a + b, 0) - Object.values(expense).reduce((a, b) => a + b, 0);
  game.cash += net;

  // 季后赛奖金承诺（事件里答应的四强奖金）
  let bonusPaid = 0;
  const madeSemis = awards.some((a) => a.placement && a.placement <= 4);
  if (game.flags.bonusPromise && madeSemis) {
    bonusPaid = game.flags.bonusPromise;
    game.cash -= bonusPaid;
    expense.bonus = bonusPaid;
  }
  game.flags.bonusPromise = 0;

  // 声望：冠军加成
  const anyTitle = awards.some((a) => a.placement === 1);
  if (anyTitle) game.fame = Math.min(100, game.fame + FINANCE.fame.champion);
  else if (awards.some((a) => a.placement === 2)) game.fame = Math.min(100, game.fame + FINANCE.fame.runnerUp);

  const finalDiv = divisionOfTeam(game, pid);

  const summary = {
    season: game.season,
    rank: finalRank,
    div: finalDiv,
    divRank: me.divRank,
    awards,
    leaguePlacement,
    income,
    expense,
    net,
    bonusPaid,
    trainingSpend: game.flags.trainingSpend || 0,
    businessIncome: game.flags.businessIncome || 0,
    matchIncome: game.flags.matchIncome || 0,
    cashAfter: Math.round(game.cash),
    fameAfter: Math.round(game.fame * 10) / 10,
    champion: awards.some((a) => a.placement === 1),
  };
  game.history.push(summary);
  game.lastDivisionGroups = game.groupsByRound[3] || game.groupsByRound[2] || game.groupsByRound[1];
  game.lastRank = summary.rank;
  game.lastDiv = summary.div;

  // 财务与战绩考核
  if (game.cash < 0) game.bankruptSeasons = (game.bankruptSeasons || 0) + 1;
  else game.bankruptSeasons = 0;
  if (summary.rank >= 15) game.bottomSeasons = (game.bottomSeasons || 0) + 1;
  else game.bottomSeasons = 0;

  game.flags.pendingTransferIncome = 0;
  game.flags.pendingTransferCost = 0;
  game.flags.youthInvest = 0;
  game.flags.trainingSpend = 0;
  game.eventPending = null;

  return { type: 'seasonEnd', summary, ranking };
}

/** 进入下一个赛季（或判定结束） */
function beginNextSeason(game) {
  if (game.gameOver) return { type: 'gameOver', gameOver: game.gameOver };
  // 强制结束优先于赛季数量上限：破产/解雇发生在先，就不该以"四个赛季结束"收场

    if (k === 'class') el.className = v;

    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);

    else el.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
